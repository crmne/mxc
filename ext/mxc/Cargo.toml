[package]
name = "mxc"
version = "0.3.0"
edition = "2021"
authors = ["Carmine Paolino <carmine@paolino.me>"]
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = "0.8.2"
# A fork of mxc-sdk 1.0.0 that adds resource limits (microsoft/mxc#1498) and
# a Landlock backend (microsoft/mxc#1494), until MXC releases them.
mxc-sdk = { git = "https://github.com/crmne/microsoft-mxc", rev = "b39a69ca8af93ba4979d3b8c5349892fcc10ceee" }
rb-sys = { version = "0.9.130", features = ["stable-api-compiled-fallback"] }
serde_json = "1"

[build-dependencies]
rb-sys-env = "0.2.2"
