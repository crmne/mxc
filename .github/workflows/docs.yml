name: Docs

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "docs/**"
      - "lib/**"
      - ".rdoc_options"
      - ".github/workflows/docs.yml"
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: crmne/jekyll-vitepress-theme/.github/workflows/publish-docs.yml@v1
    with:
      root-bundle: true
